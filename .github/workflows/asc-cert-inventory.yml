name: ASC certificate inventory (read-only)
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install JWT support
        run: python3 -m pip -q install 'PyJWT==2.10.1' cryptography
      - name: GET certificate and active profile metadata only
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, time, urllib.error, urllib.parse, urllib.request
          import jwt
          now = int(time.time())
          token = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 300,
                              'aud': 'appstoreconnect-v1'},
                             base64.b64decode(os.environ['ASC_KEY_P8_BASE64'], validate=True),
                             algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'})
          def safe(value):
              value = re.sub(r'[^\x20-\x7e]', '?', str(value or 'unknown'))
              return re.sub(r'[0-9A-Fa-f]{8}-[0-9A-Fa-f-]{16,}|[0-9A-Fa-f]{20,}', '<redacted>', value)
          def inventory(kind, params, fields):
              url = 'https://api.appstoreconnect.apple.com/v1/' + kind + '?' + urllib.parse.urlencode(params)
              count = 0
              while url:
                  if not url.startswith('https://api.appstoreconnect.apple.com/v1/'):
                      raise SystemExit('Unexpected pagination origin')
                  req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token}, method='GET')
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError as error:
                      print(kind + ' GET HTTP ' + str(error.code) + '; response withheld')
                      return
                  print(kind + ' GET HTTP 200')
                  for item in payload.get('data', []):
                      attrs = item.get('attributes', {})
                      values = [safe(attrs.get(field)) for field in fields]
                      if kind == 'certificates':
                          values.append('id suffix=' + safe(item['id'][-6:]))
                      print(kind + ': ' + ' | '.join(values))
                      count += 1
                  url = payload.get('links', {}).get('next')
              print(kind + ' count=' + str(count))
          inventory('certificates', {'fields[certificates]': 'certificateType,displayName,name,platform,expirationDate', 'limit': '200'},
                    ['certificateType', 'displayName', 'expirationDate'])
          inventory('profiles', {'filter[profileState]': 'ACTIVE', 'fields[profiles]': 'name,profileType,createdDate,expirationDate', 'limit': '200'},
                    ['name', 'profileType', 'createdDate', 'expirationDate'])
          PY
