name: Meltemi iPhone Ad Hoc
'on':
  workflow_dispatch:
    inputs:
      udid:
        description: Extra tester UDID (empty uses the IPHONE_UDID secret; inputs are visible in public logs)
        type: string
        required: false
        default: ''
      device_name:
        description: Name used only for a newly registered device
        type: string
        default: Yigit iPhone 15
permissions:
  contents: read
concurrency:
  group: meltemi-ios-adhoc
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MELTEMI_PLAY_DEPLOY_KEY: ${{ secrets.MELTEMI_PLAY_DEPLOY_KEY }}
      DEVICE_UDID: ${{ inputs.udid || secrets.IPHONE_UDID }}
      DEVICE_NAME: ${{ inputs.device_name }}
      BUILD_NUMBER: 1000.${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and prepare private authentication key
        run: python3 tools/ios_ci.py prepare
      - name: Select newest stable installed Xcode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode*.app'):
              r = subprocess.run([str(path / 'Contents/Developer/usr/bin/xcodebuild'), '-version'], capture_output=True, text=True)
              m = re.search(r'^Xcode (\d+(?:\.\d+)*)\s*$', r.stdout, re.M)
              if r.returncode == 0 and m and not re.search(r'beta|rc|preview', path.name, re.I):
                  candidates.append((tuple(map(int, m.group(1).split('.'))), path))
          if not candidates:
              raise SystemExit('No stable installed Xcode found')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + str(max(candidates)[1] / 'Contents/Developer') + '\n')
          PY
      - name: Download official Godot 4.7.2 and matching templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          for file in Godot_v4.7.2-stable_macos.universal.zip Godot_v4.7.2-stable_export_templates.tpz; do
            curl --fail --location --retry 3 "$base/$file" -o "$file"
          done
          # Verify both downloads whenever the official release publishes checksums.
          status=$(curl --location --retry 3 --silent --show-error -w '%{http_code}' "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt)
          if [[ "$status" == 200 ]]; then
            python3 - <<'PY'
          import hashlib, pathlib
          lines = pathlib.Path('SHA512-SUMS.txt').read_text().splitlines()
          for filename in ('Godot_v4.7.2-stable_macos.universal.zip', 'Godot_v4.7.2-stable_export_templates.tpz'):
              entries = [line.split()[0] for line in lines if line.split() and line.split()[-1].lstrip('*') == filename]
              if len(entries) != 1:
                  raise SystemExit('Missing or duplicate official checksum: ' + filename)
              digest = hashlib.sha512()
              with open(filename, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      digest.update(chunk)
              if digest.hexdigest() != entries[0].lower():
                  raise SystemExit('Checksum mismatch: ' + filename)
          PY
          elif [[ "$status" == 404 ]]; then
            printf '::warning::Official release has no SHA512-SUMS.txt; downloads use GitHub HTTPS.\n'
          else
            printf '::error::Checksum lookup failed (HTTP %s)\n' "$status"
            exit 1
          fi
          unzip -q Godot_v4.7.2-stable_macos.universal.zip
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d unpacked
          templates="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$templates"
          cp -R unpacked/templates/. "$templates/"
          test -f "$templates/ios.zip"
          printf 'GODOT=%s\n' "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Register device and ensure bundle ID (idempotent)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" -q install 'PyJWT[crypto]==2.10.1'
          "$RUNNER_TEMP/asc-venv/bin/python" tools/ios_ci.py register
      - name: Export Godot iOS Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          "$GODOT" --version
          mkdir -p build/ios
          "$GODOT" --headless --path game --editor --import
          "$GODOT" --headless --path game --export-release iOS "$PWD/build/ios/Meltemi.zip"
          test -d build/ios/Meltemi.xcodeproj
      - name: Import reusable distribution identity and fetch existing profile (GET only)
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_NAME: ${{ secrets.IOS_ADHOC_PROFILE_NAME }}
        run: '"$RUNNER_TEMP/asc-venv/bin/python" tools/ios_signing.py install'
      - name: Archive with existing distribution identity (manual signing)
        run: |
          set -euo pipefail
          if ! xcodebuild archive -project build/ios/Meltemi.xcodeproj -scheme Meltemi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Meltemi.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION=0.1.0 TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$SIGNING_PROFILE_UUID" PROVISIONING_PROFILE= \
            > "$RUNNER_TEMP/archive.log" 2>&1; then
            printf '::error::Archive failed. Redacted error lines follow (device IDs and fingerprints removed).\n'
            grep -E -i 'error:|requires a provisioning|no profiles|no signing|conflicting|failed|not registered' "$RUNNER_TEMP/archive.log" \
              | sed -E 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}/<udid>/g; s/[0-9A-Fa-f]{40}/<hex40>/g; s/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/<uuid>/g' \
              | sort -u | head -40
            exit 1
          fi
      - name: Export Ad Hoc IPA
        run: |
          set -euo pipefail
          # ExportOptions.plist was generated from the validated existing profile.
          if ! xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Meltemi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export-adhoc" \
            > "$RUNNER_TEMP/export.log" 2>&1; then
            printf '::error::Ad Hoc export failed; raw signing diagnostics remain private on the ephemeral runner.\n'
            exit 1
          fi
      - name: Verify exported signing and generate OTA page
        run: python3 tools/ios_ci.py package
      - uses: actions/upload-artifact@v4
        with:
          name: meltemi-ios-adhoc-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-publish/
          retention-days: 7
          if-no-files-found: error
      - name: Check out existing Pages repository
        uses: actions/checkout@v4
        with:
          repository: yeetozer/meltemi-play
          ssh-key: ${{ secrets.MELTEMI_PLAY_DEPLOY_KEY }}
          path: ios-deploy
          ref: main
          persist-credentials: true
      - name: Publish only ios directory (never force push)
        run: |
          set -euo pipefail
          mkdir -p ios-deploy/ios
          cp "$RUNNER_TEMP/ios-publish/"{Meltemi.ipa,manifest.plist,index.html} ios-deploy/ios/
          cd ios-deploy
          git config user.name yeetozer
          git config user.email yigitozer@hotmail.com
          git add -- ios/Meltemi.ipa ios/manifest.plist ios/index.html
          git commit -m "Publish Meltemi iOS Ad Hoc build $BUILD_NUMBER"
          # Rebase preserves concurrent web publications; conflicts fail rather than overwrite.
          git pull --rebase origin main
          git push origin HEAD:main
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Delete temporary signing keychain and profile
        if: always()
        run: |
          # Every action is best-effort, including under the runner's bash -e.
          # Suppress diagnostics so signing paths and identifiers remain private.
          python3 - <<'PY' >/dev/null 2>&1 || true
          import json, os, pathlib, subprocess
          original = pathlib.Path(os.environ['RUNNER_TEMP']) / 'original-keychains.json'
          if original.exists():
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s',
                              *json.loads(original.read_text())], check=True)
          PY
          security delete-keychain "$RUNNER_TEMP/meltemi-signing.keychain-db" >/dev/null 2>&1 || true
          python3 - <<'PY' >/dev/null 2>&1 || true
          import os, pathlib
          installed = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installed-profile-path'
          if installed.exists():
              pathlib.Path(installed.read_text()).unlink(missing_ok=True)
          PY
          rm -f "$RUNNER_TEMP/distribution.p12" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/adhoc.mobileprovision" "$RUNNER_TEMP/installed-profile-path" "$RUNNER_TEMP/original-keychains.json" >/dev/null 2>&1 || true
      - name: Delete private key and temporary passwords
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" >/dev/null 2>&1 || true
          # Passwords normally stay in memory; remove any temporary signing files too.
          find "$RUNNER_TEMP" -type f \( -name '*.p12' -o -name '*.p8' -o -iname '*password*' \) -delete >/dev/null 2>&1 || true
